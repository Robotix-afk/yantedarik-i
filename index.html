<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kendi Dilimiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #07070b;
            --bg: #0c0c12;
            --card: rgba(22, 22, 32, 0.8);
            --card-solid: #14141e;
            --sidebar: #0e0e16;
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.12);
            --text: #f0f0f5;
            --muted: #7a7a8c;
            --accent: #8b5cf6;
            --accent-2: #a78bfa;
            --accent-glow: rgba(139, 92, 246, 0.35);
            --success: #34d399;
            --success-dim: rgba(52, 211, 153, 0.15);
            --danger: #f87171;
            --radius: 14px;
            --sidebar-w: 260px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-deep);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== TOP BAR ===== */
        .topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 56px;
            background: rgba(10, 10, 16, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            padding: 6px;
        }

        .brand {
            font-weight: 700;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #fff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .datetime-box {
            text-align: right;
            line-height: 1.25;
        }

        .datetime-box .time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent-2);
            letter-spacing: 0.5px;
        }

        .datetime-box .date {
            font-size: 0.72rem;
            color: var(--muted);
        }

        .auth-btns {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 7px 14px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-login {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-login:hover { border-color: var(--accent); color: var(--accent-2); }

        .btn-register {
            background: linear-gradient(135deg, #7c3aed, #8b5cf6);
            color: white;
        }
        .btn-register:hover { filter: brightness(1.1); }

        .user-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--accent-2);
        }
        .user-chip button {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.75rem;
        }

        /* ===== LAYOUT ===== */
        .layout {
            display: flex;
            padding-top: 56px;
            min-height: 100vh;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            position: fixed;
            top: 56px;
            left: 0;
            bottom: 0;
            width: var(--sidebar-w);
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            padding: 16px 12px;
            overflow-y: auto;
            z-index: 90;
            transition: transform 0.3s;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 10px;
            color: var(--muted);
            font-weight: 500;
            font-size: 0.92rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }

        .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
        .nav-item.active {
            background: rgba(139, 92, 246, 0.15);
            color: var(--accent-2);
        }

        .nav-item svg { flex-shrink: 0; opacity: 0.8; }

        .nav-section {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #3f3f4d;
            padding: 16px 14px 8px;
            font-weight: 600;
        }

        /* ===== MAIN ===== */
        .main {
            margin-left: var(--sidebar-w);
            flex: 1;
            padding: 28px 24px 60px;
            max-width: 900px;
        }

        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== TRANSLATOR ===== */
        .tabs {
            display: flex;
            gap: 6px;
            background: var(--card-solid);
            padding: 6px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            position: relative;
        }

        .tab {
            flex: 1;
            padding: 11px;
            border: none;
            background: transparent;
            color: var(--muted);
            font-family: inherit;
            font-weight: 550;
            font-size: 0.88rem;
            border-radius: 8px;
            cursor: pointer;
            transition: color 0.25s;
            position: relative;
            z-index: 1;
        }
        .tab.active { color: white; }
        .tab-indicator {
            position: absolute;
            top: 6px; bottom: 6px; left: 6px;
            width: calc(50% - 9px);
            background: linear-gradient(135deg, #7c3aed, #8b5cf6);
            border-radius: 8px;
            box-shadow: 0 4px 16px var(--accent-glow);
            transition: transform 0.3s cubic-bezier(0.34, 1.4, 0.64, 1);
            z-index: 0;
        }
        .tabs[data-active="decode"] .tab-indicator { transform: translateX(calc(100% + 6px)); }

        .input-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 14px;
        }
        .input-card:focus-within { border-color: rgba(139,92,246,0.4); }

        .input-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        textarea {
            width: 100%;
            min-height: 110px;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: inherit;
            font-size: 1.05rem;
            line-height: 1.5;
            resize: vertical;
            outline: none;
        }
        textarea::placeholder { color: #3f3f4d; }

        .btn-row { display: flex; gap: 10px; margin-bottom: 22px; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.92rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            flex: 1;
            background: linear-gradient(135deg, #7c3aed, #8b5cf6);
            color: white;
            box-shadow: 0 4px 18px var(--accent-glow);
        }
        .btn-primary:hover { transform: translateY(-1px); }
        .btn-ghost {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { color: var(--text); border-color: var(--border-hover); }

        .result-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            display: none;
            margin-bottom: 24px;
        }
        .result-card.show { display: block; animation: fadeIn 0.35s ease; }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: linear-gradient(90deg, rgba(139,92,246,0.12), rgba(99,102,241,0.06));
            border-bottom: 1px solid var(--border);
        }

        .translate-badge {
            background: linear-gradient(135deg, #7c3aed, #8b5cf6);
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            padding: 4px 10px;
            border-radius: 5px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
        }
        .icon-btn:hover { color: var(--text); background: rgba(255,255,255,0.05); }
        .icon-btn.copied { color: var(--success); }

        .result-body { padding: 18px 16px; }

        .cipher-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #e0e0ff, #c4b5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            word-break: break-word;
        }

        .translation-row {
            display: flex;
            gap: 8px;
            padding: 9px 12px;
            background: var(--success-dim);
            border-radius: 8px;
            border: 1px solid rgba(52,211,153,0.15);
            font-size: 0.9rem;
        }
        .translation-row .label { color: var(--success); font-weight: 600; }
        .translation-row .value { color: #a7f3d0; }

        /* ===== HISTORY ===== */
        .history-list { display: flex; flex-direction: column; gap: 10px; }
        .history-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .history-item:hover { border-color: rgba(139,92,246,0.3); }
        .history-item .h-cipher {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            color: #ddd6fe;
            margin-bottom: 4px;
        }
        .history-item .h-tr { font-size: 0.82rem; color: var(--muted); }
        .history-item .h-time { font-size: 0.72rem; color: #4a4a5a; margin-top: 6px; }
        .empty-msg { color: var(--muted); text-align: center; padding: 40px 20px; }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(6px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.show { display: flex; }

        .modal {
            background: var(--card-solid);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 380px;
            animation: fadeIn 0.25s ease;
        }
        .modal h2 { font-size: 1.3rem; margin-bottom: 18px; }
        .modal label {
            display: block;
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .modal input {
            width: 100%;
            padding: 11px 14px;
            background: var(--bg-deep);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.95rem;
            margin-bottom: 14px;
            outline: none;
        }
        .modal input:focus { border-color: var(--accent); }
        .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
        .modal-actions .btn { flex: 1; }
        .modal-switch {
            text-align: center;
            margin-top: 16px;
            font-size: 0.85rem;
            color: var(--muted);
        }
        .modal-switch a {
            color: var(--accent-2);
            cursor: pointer;
            text-decoration: none;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1a1a26;
            border: 1px solid rgba(52,211,153,0.3);
            color: var(--success);
            font-size: 0.85rem;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 10px;
            z-index: 300;
            opacity: 0;
            transition: all 0.35s;
            pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* Mobile */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; padding: 20px 14px 50px; }
            .menu-toggle { display: block; }
            .datetime-box .date { display: none; }
        }
    </style>
</head>
<body>
    <!-- TOP BAR -->
    <header class="topbar">
        <div class="topbar-left">
            <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Menü">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
            </button>
            <div class="brand" onclick="showPage('home')">Kendi Dilimiz</div>
        </div>
        <div class="topbar-right">
            <div class="datetime-box">
                <div class="time" id="live-time">--:--:--</div>
                <div class="date" id="live-date">--</div>
            </div>
            <div class="auth-btns" id="auth-area">
                <button class="btn-sm btn-login" onclick="openModal('login')">Giriş Yap</button>
                <button class="btn-sm btn-register" onclick="openModal('register')">Kayıt Ol</button>
            </div>
        </div>
    </header>

    <div class="layout">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="nav-section">Menü</div>
            <button class="nav-item active" data-page="home" onclick="showPage('home')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Ana Sayfa
            </button>
            <button class="nav-item" data-page="history" onclick="showPage('history')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                Geçmiş
            </button>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main">
            <!-- HOME: Translator -->
            <div class="page active" id="page-home">
                <div class="tabs" id="tabs" data-active="encode">
                    <div class="tab-indicator"></div>
                    <button class="tab active" data-tab="encode">Türkçe → Dilimiz</button>
                    <button class="tab" data-tab="decode">Dilimiz → Türkçe</button>
                </div>

                <div id="encode-panel">
                    <div class="input-card">
                        <div class="input-label"><span>Türkçe Metin</span><span id="encode-count">0</span></div>
                        <textarea id="input-encode" placeholder="Merhaba, nasılsın?" spellcheck="false"></textarea>
                    </div>
                    <div class="btn-row">
                        <button class="btn btn-primary" onclick="doEncode()">Şifrele</button>
                        <button class="btn btn-ghost" onclick="clearEncode()">Temizle</button>
                    </div>
                    <div class="result-card" id="result-encode">
                        <div class="result-header">
                            <span class="translate-badge">ÇEVİR</span>
                            <button class="icon-btn" onclick="copyResult('cipher-out', this)" title="Kopyala">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="pointer-events:none"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                            </button>
                        </div>
                        <div class="result-body">
                            <div class="cipher-text" id="cipher-out"></div>
                            <div class="translation-row"><span class="label">Çevirisi:</span><span class="value" id="original-out"></span></div>
                        </div>
                    </div>
                </div>

                <div id="decode-panel" style="display:none">
                    <div class="input-card">
                        <div class="input-label"><span>Şifreli Metin</span><span id="decode-count">0</span></div>
                        <textarea id="input-decode" placeholder="Fylpqwq..." spellcheck="false"></textarea>
                    </div>
                    <div class="btn-row">
                        <button class="btn btn-primary" onclick="doDecode()">Çöz</button>
                        <button class="btn btn-ghost" onclick="clearDecode()">Temizle</button>
                    </div>
                    <div class="result-card" id="result-decode">
                        <div class="result-header">
                            <span class="translate-badge">ÇEVİR</span>
                            <button class="icon-btn" onclick="copyResult('decoded-out', this)" title="Kopyala">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="pointer-events:none"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                            </button>
                        </div>
                        <div class="result-body">
                            <div class="cipher-text" id="decoded-out"></div>
                            <div class="translation-row"><span class="label">Orijinal:</span><span class="value" id="cipher-original"></span></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- HISTORY -->
            <div class="page" id="page-history">
                <h2 style="margin-bottom:18px;font-size:1.4rem">Geçmiş</h2>
                <div class="history-list" id="history-list">
                    <div class="empty-msg">Henüz çeviri yok</div>
                </div>
            </div>

            </main>
    </div>

    <!-- AUTH MODAL -->
    <div class="modal-overlay" id="auth-modal">
        <div class="modal">
            <h2 id="modal-title">Giriş Yap</h2>
            <div id="login-form">
                <label>Kullanıcı Adı</label>
                <input type="text" id="login-user" placeholder="kullanıcıadı" autocomplete="username">
                <label>Şifre</label>
                <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
                <div class="modal-actions">
                    <button class="btn btn-primary" style="width:100%" onclick="doLogin()">Giriş Yap</button>
                </div>
                <div class="modal-switch">Hesabın yok mu? <a onclick="switchModal('register')">Kayıt Ol</a></div>
            </div>
            <div id="register-form" style="display:none">
                <label>Kullanıcı Adı</label>
                <input type="text" id="reg-user" placeholder="kullanıcıadı" autocomplete="username">
                <label>Şifre</label>
                <input type="password" id="reg-pass" placeholder="••••••••" autocomplete="new-password">
                <label>Şifre Tekrar</label>
                <input type="password" id="reg-pass2" placeholder="••••••••" autocomplete="new-password">
                <div class="modal-actions">
                    <button class="btn btn-primary" style="width:100%" onclick="doRegister()">Kayıt Ol</button>
                </div>
                <div class="modal-switch">Zaten hesabın var mı? <a onclick="switchModal('login')">Giriş Yap</a></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        /* ========== CIPHER MAP ========== */
        const encodeMap = {
            'A':'Q','B':'W','C':'E','Ç':'R','D':'T','E':'Y','F':'U','G':'I','Ğ':'O','H':'P',
            'I':'Ğ','İ':'Ü','J':'A','K':'S','L':'D','M':'F','N':'G','O':'H','Ö':'J','P':'K',
            'R':'L','S':'Ş','Ş':'İ','T':'Z','U':'X','Ü':'C','V':'V','Y':'B','Z':'N'
        };
        const decodeMap = {};
        Object.entries(encodeMap).forEach(([k,v]) => decodeMap[v] = k);

        function toUpperTR(ch) {
            if (ch === 'ı') return 'I';
            if (ch === 'i') return 'İ';
            return ch.toUpperCase();
        }
        function toLowerTR(ch) {
            if (ch === 'I') return 'ı';
            if (ch === 'İ') return 'i';
            return ch.toLowerCase();
        }
        function encodeChar(ch) {
            const up = toUpperTR(ch);
            if (encodeMap[up]) {
                const m = encodeMap[up];
                return (ch !== up) ? toLowerTR(m) : m;
            }
            return ch;
        }
        function decodeChar(ch) {
            const up = toUpperTR(ch);
            if (decodeMap[up]) {
                const m = decodeMap[up];
                return (ch !== up) ? toLowerTR(m) : m;
            }
            return ch;
        }
        function encodeText(t) { return [...t].map(encodeChar).join(''); }
        function decodeText(t) { return [...t].map(decodeChar).join(''); }

        /* ========== CLOCK (Istanbul) ========== */
        function updateClock() {
            const now = new Date();
            const opts = { timeZone: 'Europe/Istanbul' };
            const time = now.toLocaleTimeString('tr-TR', { ...opts, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            const date = now.toLocaleDateString('tr-TR', { ...opts, weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById('live-time').textContent = time;
            document.getElementById('live-date').textContent = date;
        }
        updateClock();
        setInterval(updateClock, 1000);

        /* ========== NAV ========== */
        function showPage(name) {
            if (!localStorage.getItem('kd_user')) {
                showToast('Devam etmek için giriş yapmalısın');
                openModal('login');
                return;
            }
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('page-' + name).classList.add('active');
            const nav = document.querySelector(`.nav-item[data-page="${name}"]`);
            if (nav) nav.classList.add('active');
            if (name === 'history') renderHistory();
            document.getElementById('sidebar').classList.remove('open');
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        /* ========== TABS ========== */
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const tabsEl = document.getElementById('tabs');
                if (tabsEl) tabsEl.dataset.active = tab.dataset.tab;
                const ep = document.getElementById('encode-panel');
                const dp = document.getElementById('decode-panel');
                if (ep) ep.style.display = tab.dataset.tab === 'encode' ? 'block' : 'none';
                if (dp) dp.style.display = tab.dataset.tab === 'decode' ? 'block' : 'none';
            });
        });

        /* ========== ENCODE / DECODE ========== */
        const encodeInput = document.getElementById('input-encode');
        const decodeInput = document.getElementById('input-decode');

        if (encodeInput) {
            encodeInput.addEventListener('input', () => {
                const c = document.getElementById('encode-count');
                if (c) c.textContent = encodeInput.value.length;
            });
        }
        if (decodeInput) {
            decodeInput.addEventListener('input', () => {
                const c = document.getElementById('decode-count');
                if (c) c.textContent = decodeInput.value.length;
            });
        }

        function doEncode() {
            if (!localStorage.getItem('kd_user')) {
                showToast('Devam etmek için giriş yapmalısın');
                openModal('login');
                return;
            }
            const val = encodeInput.value.trim();
            if (!val) return;
            const cipher = encodeText(val);
            document.getElementById('cipher-out').textContent = cipher;
            document.getElementById('original-out').textContent = val;
            document.getElementById('result-encode').classList.add('show');
            saveHistory(cipher, val, 'encode');
        }

        function doDecode() {
            if (!localStorage.getItem('kd_user')) {
                showToast('Devam etmek için giriş yapmalısın');
                openModal('login');
                return;
            }
            const val = decodeInput.value.trim();
            if (!val) return;
            const decoded = decodeText(val);
            document.getElementById('decoded-out').textContent = decoded;
            document.getElementById('cipher-original').textContent = val;
            document.getElementById('result-decode').classList.add('show');
            saveHistory(val, decoded, 'decode');
        }

        function clearEncode() {
            encodeInput.value = '';
            document.getElementById('encode-count').textContent = '0';
            document.getElementById('result-encode').classList.remove('show');
        }
        function clearDecode() {
            decodeInput.value = '';
            document.getElementById('decode-count').textContent = '0';
            document.getElementById('result-decode').classList.remove('show');
        }

        /* ========== HISTORY ========== */
        function saveHistory(cipher, plain, type) {
            let hist = JSON.parse(localStorage.getItem('kd_history') || '[]');
            hist.unshift({
                cipher, plain, type,
                time: new Date().toISOString()
            });
            if (hist.length > 50) hist = hist.slice(0, 50);
            localStorage.setItem('kd_history', JSON.stringify(hist));
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            const hist = JSON.parse(localStorage.getItem('kd_history') || '[]');
            if (!hist.length) {
                list.innerHTML = '<div class="empty-msg">Henüz çeviri yok</div>';
                return;
            }
            list.innerHTML = hist.map(h => {
                const d = new Date(h.time);
                const tstr = d.toLocaleString('tr-TR', { timeZone: 'Europe/Istanbul' });
                return `<div class="history-item">
                    <div class="h-cipher">${esc(h.cipher)}</div>
                    <div class="h-tr">${esc(h.plain)}</div>
                    <div class="h-time">${tstr} · ${h.type === 'encode' ? 'Şifreleme' : 'Çözme'}</div>
                </div>`;
            }).join('');
        }

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        /* ========== COPY ========== */
        function copyResult(id, btn) {
            if (btn && btn.closest) btn = btn.closest('.icon-btn') || btn;
            const el = document.getElementById(id);
            const text = el ? el.textContent.trim() : '';
            if (!text) { showToast('Önce metni şifrele / çöz'); return; }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => onCopyOk(btn)).catch(() => fallbackCopy(text, btn));
            } else {
                fallbackCopy(text, btn);
            }
        }

        function fallbackCopy(text, btn) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.cssText = 'position:fixed;opacity:0;left:0;top:0';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                onCopyOk(btn);
            } catch {
                window.prompt('Kopyala (Ctrl+C):', text);
            }
            document.body.removeChild(ta);
        }

        function onCopyOk(btn) {
            if (btn) { btn.classList.add('copied'); setTimeout(() => btn.classList.remove('copied'), 1500); }
            showToast('Kopyalandı ✓');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.remove('show');
            void t.offsetWidth;
            t.classList.add('show');
            clearTimeout(window.__tt);
            window.__tt = setTimeout(() => t.classList.remove('show'), 2200);
        }

        /* ========== AUTH (localStorage) ========== */
        function openModal(type) {
            const modal = document.getElementById('auth-modal');
            if (modal) {
                modal.classList.add('show');
                switchModal(type || 'login');
            }
        }
        function closeModal() {
            const modal = document.getElementById('auth-modal');
            if (modal) modal.classList.remove('show');
        }
        function switchModal(type) {
            const title = document.getElementById('modal-title');
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            if (title) title.textContent = type === 'login' ? 'Giriş Yap' : 'Kayıt Ol';
            if (loginForm) loginForm.style.display = type === 'login' ? 'block' : 'none';
            if (regForm) regForm.style.display = type === 'register' ? 'block' : 'none';
        }

        function doRegister() {
            const u = document.getElementById('reg-user').value.trim();
            const p = document.getElementById('reg-pass').value;
            const p2 = document.getElementById('reg-pass2').value;
            if (!u || !p) return showToast('Alanları doldur');
            if (p.length < 3) return showToast('Şifre en az 3 karakter olmalı');
            if (p !== p2) return showToast('Şifreler uyuşmuyor');
            let users = JSON.parse(localStorage.getItem('kd_users') || '{}');
            if (users[u]) return showToast('Bu kullanıcı adı alınmış');
            users[u] = p;
            localStorage.setItem('kd_users', JSON.stringify(users));
            localStorage.setItem('kd_user', u);
            closeModal();
            updateAuthUI();
            showToast('Kayıt başarılı! Hoş geldin ' + u);
        }

        function doLogin() {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value;
            if (!u || !p) return showToast('Kullanıcı adı ve şifre gir');
            let users = JSON.parse(localStorage.getItem('kd_users') || '{}');
            if (!users[u] || users[u] !== p) return showToast('Hatalı kullanıcı / şifre');
            localStorage.setItem('kd_user', u);
            closeModal();
            updateAuthUI();
            showToast('Hoş geldin, ' + u);
        }

        // Enter ile giriş / kayıt
        document.getElementById('login-pass')?.addEventListener('keydown', e => {
            if (e.key === 'Enter') doLogin();
        });
        document.getElementById('reg-pass2')?.addEventListener('keydown', e => {
            if (e.key === 'Enter') doRegister();
        });

        function doLogout() {
            localStorage.removeItem('kd_user');
            updateAuthUI();
            showToast('Çıkış yapıldı');
        }

        function updateAuthUI() {
            const user = localStorage.getItem('kd_user');
            const area = document.getElementById('auth-area');
            if (user) {
                area.innerHTML = `<div class="user-chip">👤 ${esc(user)} <button onclick="doLogout()">Çıkış</button></div>`;
            } else {
                area.innerHTML = `
                    <button class="btn-sm btn-login" onclick="openModal('login')">Giriş Yap</button>
                    <button class="btn-sm btn-register" onclick="openModal('register')">Kayıt Ol</button>`;
            }
        }
        updateAuthUI();

        const authModal = document.getElementById('auth-modal');
        if (authModal) {
            authModal.addEventListener('click', e => {
                if (e.target.id === 'auth-modal') closeModal();
            });
        }

        // Sayfa yüklenince giriş yoksa modal aç
        window.addEventListener('load', () => {
            if (!localStorage.getItem('kd_user')) {
                setTimeout(() => openModal('login'), 200);
            }
        });
    </script>
</body>
</html>
